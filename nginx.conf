# OpenClaw Nginx Configuration
# This configuration provides:
# - Reverse proxy to OpenClaw Gateway
# - HTTP Basic Authentication
# - Rate limiting
# - WebSocket support
# - Security headers

# Upstream for OpenClaw Gateway
upstream openclaw_gateway {
    server 127.0.0.1:18789;
    keepalive 32;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=openclaw_limit:10m rate=10r/s;

server {
    listen 8080 default_server;
    server_name _;

    # DNS resolver for dynamic upstream resolution (Docker DNS + fallback)
    # 127.0.0.11 is Docker's embedded DNS, 8.8.8.8 is Google DNS fallback
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Client body size (for file uploads)
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Logging
    access_log /var/log/nginx/openclaw_access.log;
    error_log /var/log/nginx/openclaw_error.log;

    # Health check endpoint (no auth required)
    location /healthz {
        proxy_pass http://openclaw_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Hooks endpoint (special handling - token-based auth)
    location /hooks {
        proxy_pass http://openclaw_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for hooks
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable auth for hooks (token validation done by OpenClaw)
        auth_basic off;
    }

    # Main application
    location / {
        # Rate limiting
        limit_req zone=openclaw_limit burst=20 nodelay;

        # Basic auth (if configured)
        auth_basic "OpenClaw Gateway";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://openclaw_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer settings for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static assets (if served by gateway)
    location /assets/ {
        proxy_pass http://openclaw_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # Browser noVNC access (requires browser sidecar with noVNC on port 6080)
    # The browser host should provide noVNC on port 6080
    # Uses variable + resolver to defer DNS lookup so nginx starts even without browser sidecar
    location /browser/ {
        set $browser_upstream browser:6080;
        proxy_pass http://$browser_upstream/vnc.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for noVNC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived VNC sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffer settings
        proxy_buffering off;
        proxy_cache off;
    }

    # noVNC websockify endpoint
    # Uses variable + resolver to defer DNS lookup so nginx starts even without browser sidecar
    location /websockify {
        set $browser_upstream browser:6080;
        proxy_pass http://$browser_upstream/websockify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }
}
