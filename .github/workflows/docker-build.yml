# =============================================================================
# OpenClaw/PicoClaw/IronClaw/ZeroClaw Docker Build and Push Workflow
# =============================================================================
# Uses Blacksmith sticky disks for fast artifact passing between jobs (3s vs 44+ min)
# PR: build → smoke-test → security-scan
# Main: build → smoke-test → security-scan → push-to-ghcr
# =============================================================================

name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstreams:
        description: 'Upstreams to build (comma-separated, e.g., "zeroclaw,openclaw")'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  security-events: write
  pull-requests: read
  actions: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      upstreams: ${{ steps.detect.outputs.upstreams }}
      any_changes: ${{ steps.detect.outputs.any_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect which upstreams need building
        id: detect
        run: |
          # Handle manual workflow dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL_UPSTREAMS="${{ github.event.inputs.upstreams }}"
            if [ -n "$MANUAL_UPSTREAMS" ]; then
              # Convert comma-separated to JSON array
              UPSTREAMS_JSON="["
              FIRST="true"
              IFS=',' read -ra UPSTREAM_ARRAY <<< "$MANUAL_UPSTREAMS"
              for upstream in "${UPSTREAM_ARRAY[@]}"; do
                upstream=$(echo "$upstream" | xargs)  # trim whitespace
                [ "$FIRST" = "false" ] && UPSTREAMS_JSON="${UPSTREAMS_JSON},"
                UPSTREAMS_JSON="${UPSTREAMS_JSON}\"${upstream}\""
                FIRST="false"
              done
              UPSTREAMS_JSON="${UPSTREAMS_JSON}]"
            else
              # No upstreams specified, build zeroclaw by default
              UPSTREAMS_JSON='["zeroclaw"]'
            fi
            echo "Manual trigger - upstreams: $UPSTREAMS_JSON"
            echo "upstreams=$UPSTREAMS_JSON" >> $GITHUB_OUTPUT
            echo "any_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git ls-tree -r --name-only HEAD)
          else
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA 2>/dev/null || git ls-tree -r --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          COMMON_PATHS=".github/workflows/ docker-compose nginx.conf lib/ config/ .dockerignore"

          BUILD_ALL="false"
          if echo "$CHANGED_FILES" | grep -q "^Dockerfile$"; then
            BUILD_ALL="true"
          elif echo "$CHANGED_FILES" | grep -q "^scripts/configure\.js$"; then
            BUILD_ALL="true"
          elif echo "$CHANGED_FILES" | grep -qE "^scripts/(entrypoint|smoke-test|healthcheck)\.sh$"; then
            BUILD_ALL="true"
          fi

          if [ "$BUILD_ALL" = "false" ]; then
            for pattern in $COMMON_PATHS; do
              if echo "$CHANGED_FILES" | grep -q "^$pattern"; then
                BUILD_ALL="true"
                break
              fi
            done
          fi

          if [ "$BUILD_ALL" = "true" ]; then
            echo "upstreams=[\"zeroclaw\"]" >> $GITHUB_OUTPUT
            echo "any_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BUILD_ZEROCLAW="false"
          for file in $CHANGED_FILES; do
            case "$file" in
              Dockerfile-zeroclaw|scripts/configure-zeroclaw.js|.zeroclaw-*|zeroclaw-*) BUILD_ZEROCLAW="true" ;;
            esac
          done

          FIRST="true"
          UPSTREAMS_JSON="["
          if [ "$BUILD_ZEROCLAW" = "true" ]; then
            [ "$FIRST" = "false" ] && UPSTREAMS_JSON="${UPSTREAMS_JSON},"
            UPSTREAMS_JSON="${UPSTREAMS_JSON}\"zeroclaw\""
            FIRST="false"
          fi
          UPSTREAMS_JSON="${UPSTREAMS_JSON}]"

          echo "upstreams=$UPSTREAMS_JSON" >> $GITHUB_OUTPUT
          if [ "$UPSTREAMS_JSON" = "[]" ]; then
            echo "any_changes=false" >> $GITHUB_OUTPUT
          else
            echo "any_changes=true" >> $GITHUB_OUTPUT
          fi

  pre-commit:
    name: Pre-Commit Checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pre-commit environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  python-tests:
    name: Python Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  build:
    name: Build (${{ matrix.upstream }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: [detect-changes, pre-commit, python-tests]
    if: |
      always() &&
      needs.pre-commit.result == 'success' &&
      needs.python-tests.result == 'success' &&
      needs.detect-changes.outputs.any_changes == 'true'
    strategy:
      matrix:
        upstream: ${{ fromJson(needs.detect-changes.outputs.upstreams) }}
        include:
          - upstream: zeroclaw
            github_owner: zeroclaw-labs
            github_repo: zeroclaw
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      upstream_version: ${{ steps.determine-version.outputs.upstream_version }}
      image_tags: ${{ steps.determine-version.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mount sticky disk for Docker image
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-${{ matrix.upstream }}-docker-image-${{ github.run_id }}
          path: /mnt/docker-images

      - name: Determine version and tags
        id: determine-version
        run: |
          UPSTREAM="${{ matrix.upstream }}"
          case "$UPSTREAM" in
            zeroclaw)
              PREFIX="zc"
              OWNER="zeroclaw-labs"
              REPO="zeroclaw"
              ;;
            *)
              PREFIX="${UPSTREAM:0:2}"
              OWNER="${{ matrix.github_owner }}"
              REPO="${{ matrix.github_repo }}"
              ;;
          esac

          if [ "${{ github.ref_type }}" = "tag" ]; then
            XFANTH_TAG="xfanth_${{ github.ref_name }}"
          else
            XFANTH_TAG="xfanth_main"
          fi

          # Always read commit from tracking file - this ensures reproducible builds
          COMMIT_FILE=".${UPSTREAM}-main-commit"
          TRACKED_COMMIT=$(cat "$COMMIT_FILE" 2>/dev/null || echo "")

          if [ -z "$TRACKED_COMMIT" ]; then
            echo "::error::Missing commit tracking file: $COMMIT_FILE"
            echo "::error::All upstreams must have pinned commit hashes in tracking files"
            exit 1
          fi

          echo "Using pinned commit for ${UPSTREAM}: ${TRACKED_COMMIT}"

          # Try to find a tag that points to this commit
          TAG=$(curl -s "https://api.github.com/repos/${OWNER}/${REPO}/git/refs/tags" | \
            jq -r --arg commit "$TRACKED_COMMIT" '.[] | select(.object.sha == $commit or .object.object.sha == $commit) | .ref' | \
            sed 's|refs/tags/||' | head -n1)

          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
            UPSTREAM_VERSION="$TAG"
            UPSTREAM_TAG="${UPSTREAM}_$TAG"
          else
            # No tag found, use commit hash as version
            UPSTREAM_VERSION="${TRACKED_COMMIT}"
            UPSTREAM_TAG="${UPSTREAM}_${TRACKED_COMMIT:0:8}"
          fi

          echo "version=$XFANTH_TAG" >> $GITHUB_OUTPUT
          echo "tags=$XFANTH_TAG,$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "xfanth_tag=$XFANTH_TAG" >> $GITHUB_OUTPUT
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "upstream_commit=$TRACKED_COMMIT" >> $GITHUB_OUTPUT

      - name: Setup Blacksmith Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/xfanth/${{ matrix.upstream }}
          tags: |
            type=raw,value=${{ steps.determine-version.outputs.xfanth_tag }}
            type=raw,value=${{ steps.determine-version.outputs.upstream_tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.upstream }}
            org.opencontainers.image.description=Self-hosted AI agent gateway
            org.opencontainers.image.vendor=OpenClaw Community
            org.opencontainers.image.licenses=MIT
            upstream=${{ matrix.upstream }}

      - name: Build Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile-${{ matrix.upstream }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}-${{ matrix.upstream }}:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_VERSION=${{ steps.determine-version.outputs.upstream_version }}
            UPSTREAM_COMMIT=${{ steps.determine-version.outputs.upstream_commit }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            IMAGE_VERSION=${{ steps.determine-version.outputs.xfanth_tag }}

      - name: Save Docker image to sticky disk
        run: |
          mkdir -p /mnt/docker-images
          IMAGE_TAG="${{ env.IMAGE_NAME }}-${{ matrix.upstream }}:${{ steps.meta.outputs.version }}"
          docker save -o /mnt/docker-images/docker-image.tar "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

  smoke-test:
    name: Smoke Test (${{ matrix.upstream }})
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: [detect-changes, build]
    if: always() && needs.build.result == 'success'
    strategy:
      matrix:
        upstream: ${{ fromJson(needs.detect-changes.outputs.upstreams) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mount sticky disk for Docker image
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-${{ matrix.upstream }}-docker-image-${{ github.run_id }}
          path: /mnt/docker-images

      - name: Load Docker image
        run: docker load -i /mnt/docker-images/docker-image.tar

      - name: Run smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          UPSTREAM=${{ matrix.upstream }} ./scripts/smoke-test.sh
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}-${{ matrix.upstream }}:${{ needs.build.outputs.image_tag }}
        timeout-minutes: 15

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.upstream }}
          path: |
            /tmp/build.log
            /tmp/compose.log
            /tmp/doctor.log
          retention-days: 3

  security-scan:
    name: Security Scan (${{ matrix.upstream }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [detect-changes, build]
    if: always() && needs.build.result == 'success'
    strategy:
      matrix:
        upstream: ${{ fromJson(needs.detect-changes.outputs.upstreams) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mount sticky disk for Docker image
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-${{ matrix.upstream }}-docker-image-${{ github.run_id }}
          path: /mnt/docker-images

      - name: Load Docker image
        run: docker load -i /mnt/docker-images/docker-image.tar

      - name: Get image tag
        id: get-tag
        run: |
          IMAGE_TAG=$(docker images --format "{{.Tag}}" | grep -E "^[a-f0-9]{7}$" | head -1)
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG=$(docker images --format "{{.Tag}}" | head -1)
          fi
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}-${{ matrix.upstream }}:${{ steps.get-tag.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.upstream }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.upstream }}.sarif'
          category: ${{ matrix.upstream }}

  push-to-ghcr:
    name: Push to GHCR (${{ matrix.upstream }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [detect-changes, pre-commit, python-tests, build, smoke-test, security-scan]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.pre-commit.result == 'success' &&
      needs.python-tests.result == 'success' &&
      needs.build.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.security-scan.result == 'success' &&
      needs.detect-changes.outputs.any_changes == 'true'
    strategy:
      matrix:
        upstream: ${{ fromJson(needs.detect-changes.outputs.upstreams) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount sticky disk for Docker image
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-${{ matrix.upstream }}-docker-image-${{ github.run_id }}
          path: /mnt/docker-images

      - name: Determine version and tags
        id: determine-version
        run: |
          UPSTREAM="${{ matrix.upstream }}"
          case "$UPSTREAM" in
            zeroclaw)
              PREFIX="zc"
              ;;
            *)
              PREFIX="${UPSTREAM:0:2}"
              ;;
          esac

          if [ "${{ github.ref_type }}" = "tag" ]; then
            XFANTH_TAG="xfanth_${{ github.ref_name }}"
          else
            XFANTH_TAG="xfanth_main"
          fi

          BASE_COMMIT="${{ github.event.before }}"
          TAGGED_FILE=".${UPSTREAM}-tagged-commit"
          MAIN_FILE=".${UPSTREAM}-main-commit"
          TAGGED_CHANGED=$(git diff --name-only $BASE_COMMIT HEAD 2>/dev/null | grep -q "^${TAGGED_FILE}$" && echo "true" || echo "false")
          MAIN_CHANGED=$(git diff --name-only $BASE_COMMIT HEAD 2>/dev/null | grep -q "^${MAIN_FILE}$" && echo "true" || echo "false")

          if [ "$TAGGED_CHANGED" = "true" ]; then
            TRACKED_COMMIT=$(cat "$TAGGED_FILE" 2>/dev/null || echo "")
            if [ -n "$TRACKED_COMMIT" ]; then
              TAG=$(curl -s "https://api.github.com/repos/zeroclaw-labs/zeroclaw/git/refs/tags" | \
                jq -r --arg commit "$TRACKED_COMMIT" '.[] | select(.object.sha == $commit or .object.object.sha == $commit) | .ref' | \
                sed 's|refs/tags/||' | head -n1)
            fi
            if [ -z "$TAG" ]; then
              TAG=$(curl -s "https://api.github.com/repos/zeroclaw-labs/zeroclaw/releases/latest" | jq -r '.tag_name // empty')
            fi
            if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
              UPSTREAM_TAG="${UPSTREAM}_$TAG"
            else
              UPSTREAM_TAG="${UPSTREAM}_main"
            fi
          else
            UPSTREAM_TAG="${UPSTREAM}_main"
          fi

          echo "version=$XFANTH_TAG" >> $GITHUB_OUTPUT
          echo "tags=$XFANTH_TAG,$UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: Load and push image
        run: |
          docker load -i /mnt/docker-images/docker-image.tar

          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "${{ matrix.upstream }}" | head -1)
          echo "Loaded image: $IMAGE_ID"

          TAGS="${{ steps.determine-version.outputs.tags }}"
          IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
          for TAG in "${TAG_ARRAY[@]}"; do
            TARGET="${{ env.REGISTRY }}/xfanth/${{ matrix.upstream }}:$TAG"
            docker tag "$IMAGE_ID" "$TARGET"
            docker push "$TARGET"
            echo "Pushed $TARGET"
          done
